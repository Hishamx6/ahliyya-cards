<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>البطل · مهمة التشخيص</title>
<style>
:root{--bg:#0b0614;--card:#160d24;--pink:#ff2bd6;--cyan:#21f3ff;--lime:#a6ff3b;--gold:#ffc83d;--red:#ff4060;--tx:#f2eaff;--mut:#a99bc4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#3a0f55,transparent 50%),radial-gradient(circle at 0% 110%,#06364a,transparent 50%),var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
.wrap{max-width:480px;margin:auto;padding:16px}
.logo{font-weight:900;font-size:26px;letter-spacing:1px;text-align:center;margin:8px 0 2px;color:var(--gold);text-shadow:0 0 12px #ff8a00,3px 3px 0 #000;font-style:italic}
.sub{text-align:center;color:var(--mut);font-size:13px;margin-bottom:14px}
.city{height:60px;margin:6px 0 14px;background:linear-gradient(transparent 60%,#ff2bd633),repeating-linear-gradient(90deg,#1e1233 0 18px,#24163d 18px 30px,#170c28 30px 44px);clip-path:polygon(0 60%,6% 60%,6% 20%,12% 20%,12% 45%,20% 45%,20% 5%,27% 5%,27% 50%,35% 50%,35% 30%,44% 30%,44% 0,50% 0,50% 40%,60% 40%,60% 15%,68% 15%,68% 55%,76% 55%,76% 25%,85% 25%,85% 45%,93% 45%,93% 10%,100% 10%,100% 100%,0 100%);border-bottom:2px solid var(--pink)}
.btn{display:block;width:100%;padding:14px;margin:10px 0;border-radius:14px;border:2px solid var(--cyan);background:#0e1b2b;color:var(--tx);font-size:17px;font-weight:700;text-align:right;cursor:pointer;box-shadow:0 0 10px #21f3ff44}
.btn small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.btn.done{border-color:var(--lime);box-shadow:0 0 10px #a6ff3b55}
.card{background:var(--card);border:1px solid #3b2560;border-radius:18px;padding:16px;box-shadow:0 0 22px #ff2bd622}
.hud{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;font-size:13px;color:var(--mut)}
.bar{height:8px;background:#2a1a40;border-radius:8px;margin:8px 0 12px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--cyan))}
.tag{display:inline-block;font-size:12px;color:var(--cyan);border:1px solid var(--cyan);border-radius:20px;padding:2px 10px}
.ctx{background:#0f0819;border-right:3px solid var(--gold);padding:10px;margin:10px 0;font-size:14px;color:#e0d4f5;line-height:1.7}
.q{font-size:18px;line-height:1.7;margin:12px 0}
.opt{display:block;width:100%;text-align:inherit;margin:8px 0;padding:12px;border-radius:12px;border:1px solid #4b3570;background:#1d1230;color:var(--tx);font-size:16px;cursor:pointer}
.opt.ok{border-color:var(--lime);background:#183a10}.opt.no{border-color:var(--red);background:#3a0f1a}
.fb{margin-top:10px;font-size:15px;line-height:1.6}.fb b{font-size:20px;font-style:italic}
.src{font-size:11px;color:var(--mut);margin-top:10px}
.ltr{direction:ltr;text-align:left}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:7px 4px;border-bottom:1px solid #2e1e47}td.n{text-align:left;font-weight:700}
.big{font-size:44px;font-weight:900;text-align:center;color:var(--lime);text-shadow:0 0 14px #a6ff3b88}
.lnk{color:var(--mut);background:none;border:0;font-size:13px;text-decoration:underline;cursor:pointer;margin-top:8px}
</style></head><body><div class="wrap" id="app"></div>
<script src="data.js"></script>
<script>
const KEY="hero_diag_v1",LIM=15*60;
let S=JSON.parse(localStorage.getItem(KEY)||"{}");const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const $=h=>document.getElementById("app").innerHTML=h;let cur,idx,timer,left;
function home(){clearInterval(timer);let h=`<div class="logo">GROVE ST. ACADEMY</div><div class="sub">مهمّة التشخيص · 3 جلسات × 15 دقيقة · البطل ← الأهلية 90+</div><div class="city"></div>`;
for(const k of ["ar","en","ma"]){const s=SESSIONS[k],r=S[k];h+=`<button class="btn ${r&&r.end?"done":""}" onclick="start('${k}')">${s.icon} · ${s.name} — ${s.items.length} مهام<small>${r&&r.end?"خلصت ✓ "+score(k)+"% · اضغط للملخّص":"15 دقيقة · ابدأ المهمّة"}</small></button>`}
if(["ar","en","ma"].some(k=>S[k]&&S[k].end))h+=`<button class="btn" style="border-color:var(--gold)" onclick="summary()">🏆 ملخّص كل المواضيع</button>`;$(h)}
function score(k){const r=S[k];if(!r)return 0;const n=SESSIONS[k].items.length;return Math.round(100*r.ans.filter((a,i)=>a===SESSIONS[k].items[i].a).length/n)}
function start(k){cur=k;if(S[k]&&S[k].end)return report(k);if(!S[k])S[k]={ans:[],used:0};if(S[k].used==null){S[k].used=0;delete S[k].t0}save();idx=S[k].ans.length;
clearInterval(timer);timer=setInterval(()=>{if(document.hidden||cur!==k)return;S[k].used++;if(S[k].used%5==0)save();left=LIM-S[k].used;const e=document.getElementById("tm");if(e)e.textContent=fmt(left);if(left<=0)finish()},1000);show()}
function reset(k){delete S[k];save();start(k)}
const fmt=s=>s<=0?"0:00":Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function show(){const s=SESSIONS[cur],it=s.items[idx];if(!it)return finish();left=LIM-(S[cur].used||0);const d=s.ltr?"ltr":"";
$(`<div class="card"><div class="hud"><span>${s.name} · مهمّة ${idx+1}/${s.items.length}</span><span>⏱ <b id="tm">${fmt(left)}</b></span></div>
<div class="bar"><i style="width:${100*idx/s.items.length}%"></i></div><span class="tag">${it.t}</span>
${it.ctx?`<div class="ctx ${d}">${it.ctx}</div>`:""}<div class="q ${d}">${it.q}</div>
<div class="${d}">${it.o.map((o,i)=>`<button class="opt" id="o${i}" onclick="pick(${i})">${o}</button>`).join("")}</div><div id="fb"></div>
<div class="src">المصدر: <bdi>${it.src}</bdi></div></div><button class="lnk" onclick="clearInterval(timer);home()">↩ رجوع (التقدّم والوقت محفوظين)</button>`)}
function pick(i){const it=SESSIONS[cur].items[idx];if(S[cur].ans.length>idx)return;S[cur].ans.push(i);save();
document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(j===it.a)b.classList.add("ok");else if(j===i)b.classList.add("no")});
const ok=i===it.a;document.getElementById("fb").innerHTML=`<div class="fb"><b style="color:${ok?"var(--lime)":"var(--red)"}">${ok?"MISSION PASSED! +10 RESPECT":"WASTED"}</b><br><span dir="auto" style="unicode-bidi:plaintext;display:block">${it.ex}</span></div><button class="btn" style="text-align:center" onclick="idx++;show()">التالي ←</button>`}
function finish(){clearInterval(timer);if(!S[cur].end){S[cur].end=Date.now();save()}report(cur)}
function topics(k){const m={};SESSIONS[k].items.forEach((it,i)=>{m[it.t]=m[it.t]||[0,0];m[it.t][1]++;if(S[k].ans[i]===it.a)m[it.t][0]++});return m}
function rows(k){return Object.entries(topics(k)).map(([t,[c,n]])=>`<tr><td>${t}</td><td class="n" style="color:${c===n?"var(--lime)":c?"var(--gold)":"var(--red)"}">${c}/${n}</td></tr>`).join("")}
function report(k){const s=SESSIONS[k],r=S[k],sc=score(k),un=s.items.length-r.ans.length;
$(`<div class="card"><div class="logo" style="font-size:20px">${s.name} · RESULT</div><div class="big">${sc}%</div><div class="sub">الهدف 90+ · ${new Date(r.end).toLocaleDateString("ar")} ${un?"· "+un+" بدون جواب (انتهى الوقت)":""}</div><table>${rows(k)}</table><div class="sub" style="margin-top:12px">📸 صوّر الشاشة وابعتها لأبوك</div></div><button class="btn" style="text-align:center" onclick="home()">رجوع للخريطة</button><button class="lnk" onclick="reset('${k}')">↻ إعادة الجلسة من جديد</button>`)}
function summary(){let h=`<div class="card"><div class="logo" style="font-size:20px">البطل · STATS</div>`;for(const k of ["ar","en","ma"])if(S[k]&&S[k].end)h+=`<h3 style="color:var(--cyan);margin:14px 0 4px">${SESSIONS[k].name} — ${score(k)}%</h3><table>${rows(k)}</table>`;
$(h+`<div class="sub" style="margin-top:12px">📸 صوّر الشاشة وابعتها لأبوك</div></div><button class="btn" style="text-align:center" onclick="home()">رجوع</button>`)}
home();
</script></body></html>
