<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>البطل · خلطة اليوم</title><style>
:root{--bg:#0b0614;--card:#160d24;--pink:#ff2bd6;--cyan:#21f3ff;--lime:#a6ff3b;--gold:#ffc83d;--red:#ff4060;--tx:#f2eaff;--mut:#a99bc4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#3a0f55,transparent 50%),radial-gradient(circle at 0% 110%,#06364a,transparent 50%),var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
.wrap{max-width:480px;margin:auto;padding:16px}
.logo{font-weight:900;font-size:26px;letter-spacing:1px;text-align:center;margin:8px 0 2px;color:var(--gold);text-shadow:0 0 12px #ff8a00,3px 3px 0 #000;font-style:italic}
.sub{text-align:center;color:var(--mut);font-size:13px;margin-bottom:14px}
.city{height:60px;margin:6px 0 14px;background:linear-gradient(transparent 60%,#ff2bd633),repeating-linear-gradient(90deg,#1e1233 0 18px,#24163d 18px 30px,#170c28 30px 44px);clip-path:polygon(0 60%,6% 60%,6% 20%,12% 20%,12% 45%,20% 45%,20% 5%,27% 5%,27% 50%,35% 50%,35% 30%,44% 30%,44% 0,50% 0,50% 40%,60% 40%,60% 15%,68% 15%,68% 55%,76% 55%,76% 25%,85% 25%,85% 45%,93% 45%,93% 10%,100% 10%,100% 100%,0 100%);border-bottom:2px solid var(--pink)}
.btn{display:block;width:100%;padding:14px;margin:10px 0;border-radius:14px;border:2px solid var(--cyan);background:#0e1b2b;color:var(--tx);font-size:17px;font-weight:700;text-align:right;cursor:pointer;box-shadow:0 0 10px #21f3ff44}
.btn small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.btn.done{border-color:var(--lime);box-shadow:0 0 10px #a6ff3b55}
.card{background:var(--card);border:1px solid #3b2560;border-radius:18px;padding:16px;box-shadow:0 0 22px #ff2bd622}
.hud{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;font-size:13px;color:var(--mut)}
.bar{height:8px;background:#2a1a40;border-radius:8px;margin:8px 0 12px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--cyan))}
.tag{display:inline-block;font-size:12px;color:var(--cyan);border:1px solid var(--cyan);border-radius:20px;padding:2px 10px}
.ctx{background:#0f0819;border-right:3px solid var(--gold);padding:10px;margin:10px 0;font-size:14px;color:#e0d4f5;line-height:1.7}
.q{font-size:18px;line-height:1.7;margin:12px 0}
.opt{display:block;width:100%;text-align:inherit;margin:8px 0;padding:12px;border-radius:12px;border:1px solid #4b3570;background:#1d1230;color:var(--tx);font-size:16px;cursor:pointer}
.opt.ok{border-color:var(--lime);background:#183a10}.opt.no{border-color:var(--red);background:#3a0f1a}
.fb{margin-top:10px;font-size:15px;line-height:1.6}.fb b{font-size:20px;font-style:italic}
.src{font-size:11px;color:var(--mut);margin-top:10px}
.ltr{direction:ltr;text-align:left}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:7px 4px;border-bottom:1px solid #2e1e47}td.n{text-align:left;font-weight:700}
.big{font-size:44px;font-weight:900;text-align:center;color:var(--lime);text-shadow:0 0 14px #a6ff3b88}
.lnk{color:var(--mut);background:none;border:0;font-size:13px;text-decoration:underline;cursor:pointer;margin-top:8px}

.inp{width:100%;padding:12px;font-size:18px;border-radius:12px;border:1px solid #4b3570;background:#1d1230;color:var(--tx);direction:ltr;text-align:center}
.hint{font-size:14px;color:var(--gold);margin-top:6px}</style></head><body><div class="wrap" id="app"></div><script>
const MIX=[{"id": "en-listA-163-def", "subject": "en", "topic": "مفردات List A", "kind": "mc", "ltr": true, "q": "Choose the best definition: protest (v.)", "o": ["a piece of writing in which you give your opinion of an academic research.", "work.", "demonstrate about/against/at something.", "something that is enjoyable gives you pleasure."], "a": 2, "hints": ["Think of the word family", "بالعربي: يحتج. يعترض أو يعارض", "Eliminate definitions of other parts of speech"], "ex": "protest (v.) = demonstrate about/against/at something. (يحتج. يعترض أو يعارض)", "source": {"file": "english/كلمات list A.xlsx", "loc": "row 163", "quote": "demonstrate about/against/at something."}}, {"id": "ma-bisector_angle-20", "subject": "ma", "topic": "هندسة: منصّفا زاويتين", "q": "بالمثلث ABC الزاوية A = 124°. BD و CE منصّفا الزاويتين B و C ويلتقيان بـ O. احسب الزاوية BOC بالدرجات.", "a": 152, "hints": ["B + C = 180 − A", "نصّهم", "BOC = 180 − (B+C)/2"], "ex": "B+C = 56، نصّهم 28 ← BOC = 152", "source": {"file": "math/رياضيات 25-26.pdf", "loc": "السؤال 10"}, "kind": "num"}, {"id": "ma-quad_common_factor-13", "subject": "ma", "topic": "معادلة تربيعية: عامل مشترك", "q": "حلّ المعادلة: 8x − 7x² = 6x − 6x². اكتب الحل غير الصفري (كسر مسموح، مثل 3/4).", "a": "2", "hints": ["انقل كل إشي لجهة وحدة", "طلّع x عامل مشترك", "x = 0 أو القوس = 0"], "ex": "(2)x = (1)x² ← x = 0 أو x = 2", "source": {"file": "math/رياضيات 25-26.pdf", "loc": "السؤال 7أ"}, "kind": "num"}, {"id": "en-listA-009-def", "subject": "en", "topic": "مفردات List A", "kind": "mc", "ltr": true, "q": "Choose the best definition: as (conj.)", "o": ["to use the good things in a situation.", "exchange in shop; money; new experience; climate change.", "the act of destroying something, or the fact of being destroyed.", "while, when."], "a": 3, "hints": ["Think of the word family", "بالعربي: بينما", "Eliminate definitions of other parts of speech"], "ex": "as (conj.) = while, when. (بينما)", "source": {"file": "english/كلمات list A.xlsx", "loc": "row 9", "quote": "while, when."}}, {"id": "ma-parabola_vertex-01", "subject": "ma", "topic": "قطع مكافئ: الرأس", "q": "جد إحداثيّ y لرأس القطع المكافئ y = −x² − 2x + 8.", "a": 9, "hints": ["x الرأس = −b/2a", "a = −1", "عوّض x بالدالة"], "ex": "x = -1 ← y = 9", "source": {"file": "math/رياضيات 25-26.pdf", "loc": "السؤال 9ب"}, "kind": "num"}, {"id": "en-listA-025-def", "subject": "en", "topic": "مفردات List A", "kind": "mc", "ltr": true, "q": "Choose the best definition: concern (v.)", "o": ["a particular situation or example of something.", "to worry or upset someone.", "method.", "general, widespread."], "a": 1, "hints": ["Think of the word family", "بالعربي: يقلق", "Eliminate definitions of other parts of speech"], "ex": "concern (v.) = to worry or upset someone. (يقلق)", "source": {"file": "english/كلمات list A.xlsx", "loc": "row 25", "quote": "to worry or upset someone."}}, {"id": "en-listA-012-def", "subject": "en", "topic": "مفردات List A", "kind": "mc", "ltr": true, "q": "Choose the best definition: be responsible for sth/doing sth", "o": ["carry out something.", "a common infectious illness that causes fever and headache.", "perfect, or the best possible.", "to be the person whose duty is to deal with someone or something."], "a": 3, "hints": ["Think of the word family", "بالعربي: يكون مسؤول عن شخص ما أو عن شيء ما أو عمل شيء ما", "Eliminate definitions of other parts of speech"], "ex": "be responsible for sth/doing sth = to be the person whose duty is to deal with someone or something. (يكون مسؤول عن شخص ما أو عن شيء ما أو عمل شيء ما)", "source": {"file": "english/كلمات list A.xlsx", "loc": "row 12", "quote": "to be the person whose duty is to deal with someone or something."}}, {"id": "ma-bisector_angle-09", "subject": "ma", "topic": "هندسة: منصّفا زاويتين", "q": "بالمثلث ABC الزاوية A = 80°. BD و CE منصّفا الزاويتين B و C ويلتقيان بـ O. احسب الزاوية BOC بالدرجات.", "a": 130, "hints": ["B + C = 180 − A", "نصّهم", "BOC = 180 − (B+C)/2"], "ex": "B+C = 100، نصّهم 50 ← BOC = 130", "source": {"file": "math/رياضيات 25-26.pdf", "loc": "السؤال 10"}, "kind": "num"}, {"id": "ma-parabola_vertex-07", "subject": "ma", "topic": "قطع مكافئ: الرأس", "q": "جد إحداثيّ y لرأس القطع المكافئ y = −x² + 4x − 2.", "a": 2, "hints": ["x الرأس = −b/2a", "a = −1", "عوّض x بالدالة"], "ex": "x = 2 ← y = 2", "source": {"file": "math/رياضيات 25-26.pdf", "loc": "السؤال 9ب"}, "kind": "num"}];const KEY="hero_mix_demo";let S=JSON.parse(localStorage.getItem(KEY)||'{"i":0,"r":[],"xp":0}'),h=0,done=false;
const save=()=>localStorage.setItem(KEY,JSON.stringify(S)),$=x=>document.getElementById("app").innerHTML=x;
const nrm=s=>String(s).replace(/\s/g,"").replace(/،/g,",");
function show(){const it=MIX[S.i];if(!it)return end();h=0;done=false;const d=it.ltr?"ltr":"";
$(`<div class="logo" style="font-size:20px">DAILY MIX · 15 MIN</div><div class="card"><div class="hud"><span>مهمّة ${S.i+1}/${MIX.length}</span><span>XP ${S.xp}</span></div><div class="bar"><i style="width:${100*S.i/MIX.length}%"></i></div>
<span class="tag">${it.topic}</span><div class="q ${d}">${it.q}</div><div class="${d}">${it.kind=="mc"?it.o.map((o,i)=>`<button class="opt" id="o${i}" onclick="ans(${i})">${o}</button>`).join(""):`<input class="inp" id="v" inputmode="decimal" placeholder="الجواب"><button class="btn" style="text-align:center" onclick="ans(document.getElementById('v').value)">افحص</button>`}</div>
<div id="hs"></div><button class="lnk" id="hb" onclick="hint()">🪜 تلميح (−XP)</button><div id="fb"></div><div class="src">المصدر: <bdi>${it.source.file} · ${it.source.loc}</bdi></div></div>`)}
function hint(){const it=MIX[S.i];if(done||h>=it.hints.length)return;document.getElementById("hs").innerHTML+=`<div class="hint">تلميح ${h+1}: <span dir="auto" style="unicode-bidi:plaintext">${it.hints[h]}</span></div>`;h++}
function ans(v){if(done)return;const it=MIX[S.i];const ok=it.kind=="mc"?v===it.a:nrm(v)===nrm(it.a);if(it.kind!="mc"&&String(v).trim()==="")return;done=true;
if(it.kind=="mc")document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(j===it.a)b.classList.add("ok");else if(j===v)b.classList.add("no")});
const xp=ok?Math.max(4,10-3*h):0;S.xp+=xp;S.r.push({id:it.id,topic:it.topic,ok,hints:h,t:Date.now()});S.i++;save();
document.getElementById("hb").remove();document.getElementById("fb").innerHTML=`<div class="fb"><b style="color:${ok?"var(--lime)":"var(--red)"}">${ok?"MISSION PASSED! +"+xp+" XP":"WASTED"}</b><br>${ok?"":"الجواب: <bdi>"+it.a+"</bdi><br>"}<span dir="auto" style="unicode-bidi:plaintext;display:block">${it.ex}</span></div><button class="btn" style="text-align:center" onclick="show()">التالي ←</button>`}
function end(){const c=S.r.filter(x=>x.ok).length;$(`<div class="card"><div class="logo" style="font-size:20px">DAILY MIX · RESULT</div><div class="big">${Math.round(100*c/S.r.length)}%</div><div class="sub">${c}/${S.r.length} · XP ${S.xp}</div><table>${S.r.map(x=>`<tr><td>${x.topic}</td><td class="n" style="color:${x.ok?"var(--lime)":"var(--red)"}">${x.ok?"✓":"✗"}${x.hints?" · 🪜"+x.hints:""}</td></tr>`).join("")}</table></div><button class="btn" style="text-align:center" onclick="localStorage.removeItem(KEY);S={i:0,r:[],xp:0};show()">جولة من جديد</button>`)}
show();</script></body></html>
