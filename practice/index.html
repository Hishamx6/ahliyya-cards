<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>البطل · خلطة اليوم</title><style>
:root{--bg:#0b0614;--card:#160d24;--pink:#ff2bd6;--cyan:#21f3ff;--lime:#a6ff3b;--gold:#ffc83d;--red:#ff4060;--tx:#f2eaff;--mut:#a99bc4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#3a0f55,transparent 50%),radial-gradient(circle at 0% 110%,#06364a,transparent 50%),var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
.wrap{max-width:480px;margin:auto;padding:16px}
.logo{font-weight:900;font-size:26px;letter-spacing:1px;text-align:center;margin:8px 0 2px;color:var(--gold);text-shadow:0 0 12px #ff8a00,3px 3px 0 #000;font-style:italic}
.sub{text-align:center;color:var(--mut);font-size:13px;margin-bottom:14px}
.city{height:60px;margin:6px 0 14px;background:linear-gradient(transparent 60%,#ff2bd633),repeating-linear-gradient(90deg,#1e1233 0 18px,#24163d 18px 30px,#170c28 30px 44px);clip-path:polygon(0 60%,6% 60%,6% 20%,12% 20%,12% 45%,20% 45%,20% 5%,27% 5%,27% 50%,35% 50%,35% 30%,44% 30%,44% 0,50% 0,50% 40%,60% 40%,60% 15%,68% 15%,68% 55%,76% 55%,76% 25%,85% 25%,85% 45%,93% 45%,93% 10%,100% 10%,100% 100%,0 100%);border-bottom:2px solid var(--pink)}
.btn{display:block;width:100%;padding:14px;margin:10px 0;border-radius:14px;border:2px solid var(--cyan);background:#0e1b2b;color:var(--tx);font-size:17px;font-weight:700;text-align:right;cursor:pointer;box-shadow:0 0 10px #21f3ff44}
.btn small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.btn.done{border-color:var(--lime);box-shadow:0 0 10px #a6ff3b55}
.card{background:var(--card);border:1px solid #3b2560;border-radius:18px;padding:16px;box-shadow:0 0 22px #ff2bd622}
.hud{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;font-size:13px;color:var(--mut)}
.bar{height:8px;background:#2a1a40;border-radius:8px;margin:8px 0 12px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--cyan))}
.tag{display:inline-block;font-size:12px;color:var(--cyan);border:1px solid var(--cyan);border-radius:20px;padding:2px 10px}
.ctx{background:#0f0819;border-right:3px solid var(--gold);padding:10px;margin:10px 0;font-size:14px;color:#e0d4f5;line-height:1.7}
.q{font-size:18px;line-height:1.7;margin:12px 0}
.opt{display:block;width:100%;text-align:inherit;margin:8px 0;padding:12px;border-radius:12px;border:1px solid #4b3570;background:#1d1230;color:var(--tx);font-size:16px;cursor:pointer}
.opt.ok{border-color:var(--lime);background:#183a10}.opt.no{border-color:var(--red);background:#3a0f1a}
.fb{margin-top:10px;font-size:15px;line-height:1.6}.fb b{font-size:20px;font-style:italic}
.src{font-size:11px;color:var(--mut);margin-top:10px}
.ltr{direction:ltr;text-align:left}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:7px 4px;border-bottom:1px solid #2e1e47}td.n{text-align:left;font-weight:700}
.big{font-size:44px;font-weight:900;text-align:center;color:var(--lime);text-shadow:0 0 14px #a6ff3b88}
.lnk{color:var(--mut);background:none;border:0;font-size:13px;text-decoration:underline;cursor:pointer;margin-top:8px}

.inp{width:100%;padding:12px;font-size:18px;border-radius:12px;border:1px solid #4b3570;background:#1d1230;color:var(--tx);direction:ltr;text-align:center}
.hint{font-size:14px;color:var(--gold);margin-top:6px}</style></head><body><div class="wrap" id="app"></div><script src="engine.js?v=3"></script><script>
const CFG=Object.fromEntries(new URLSearchParams(location.hash.slice(1)));const CODE=CFG.c||"anon";
const LM="hero_mastery_v1",LD="hero_day_v1",LIM=900;
let M=JSON.parse(localStorage.getItem(LM)||'{"topics":{},"cards":{}}'),D=JSON.parse(localStorage.getItem(LD)||"null"),BANK=[],MIX=[],h=0,done=false,tick;
const save=()=>{localStorage.setItem(LM,JSON.stringify(M));localStorage.setItem(LD,JSON.stringify(D))},$=x=>document.getElementById("app").innerHTML=x;
const nrm=s=>String(s).replace(/\s/g,"").replace(/،/g,",");
const SUB={ar:"عربي",en:"English",ma:"رياضيات"},WHY={weak:"🎯 نقطة ضعف",review:"🔁 مراجعة",new:"✨ جديد"};
const fmt=t=>Math.floor(t/60)+":"+String(t%60).padStart(2,"0");
fetch("bank.json?v=3").then(r=>r.json()).then(b=>{BANK=b;init()}).catch(()=>$(`<div class="card"><div class="q">ما قدرنا نحمّل البطاقات. جرّب كمان مرّة.</div></div>`));
function init(){const t=ENG.today();
 if(!D||D.date!==t||D.code!==CODE){const mix=ENG.build(BANK,M,t,CODE);D={date:t,code:CODE,ids:mix.map(x=>[x.id,x.why]),i:0,r:[],xp:0,used:0};save()}
 const byId=Object.fromEntries(BANK.map(x=>[x.id,x]));MIX=D.ids.filter(([id])=>byId[id]).map(([id,why])=>({...byId[id],why}));home()}
function home(){clearInterval(tick);const left=MIX.length-D.i;
 $(`<div class="logo">DAILY MIX</div><div class="sub">خلطة اليوم · ${D.date} · هدف 15 دقيقة</div><div class="city"></div>
 ${MIX.length?`<button class="btn ${left?"":"done"}" onclick="${left?"go()":"end()"}">${left?(D.i?"▶ كمّل خلطة اليوم":"▶ ابدأ خلطة اليوم"):"✔ خلصت خلطة اليوم"}<small>${MIX.length} مهمّات · ${left} باقية · ${fmt(Math.max(0,LIM-D.used))} من الوقت</small></button>`:`<div class="card"><div class="q">ما في بطاقات جاهزة اليوم. ارجع بكرا 👊</div></div>`}
 <button class="btn" onclick="map()">🗺️ خريطة الإتقان<small>وين أنت من هدف 90+</small></button>`)}
function go(){clearInterval(tick);tick=setInterval(()=>{if(document.hidden)return;D.used++;if(D.used%5==0)save();const e=document.getElementById("tm");if(e)e.textContent=fmt(Math.max(0,LIM-D.used))},1000);show()}
function show(){const it=MIX[D.i];if(!it)return end();h=0;done=false;window.t0=Date.now();const d=it.ltr?"ltr":"";
$(`<div class="logo" style="font-size:20px">DAILY MIX · 15 MIN</div><div class="card"><div class="hud"><span>مهمّة ${D.i+1}/${MIX.length}</span><span>⏱️ <b id="tm">${fmt(Math.max(0,LIM-D.used))}</b></span><span>XP <b id="xp">${D.xp}</b></span></div><div class="bar"><i style="width:${100*D.i/MIX.length}%"></i></div>
<span class="tag">${SUB[it.subject]} · ${it.topic}</span> <span class="tag" style="color:var(--gold);border-color:var(--gold)">${WHY[it.why]||""}</span>${it.ctx?`<div class="ctx ${d}">${it.ctx}</div>`:""}<div class="q ${d}">${it.q}</div><div class="${d}">${it.kind=="mc"?it.o.map((o,i)=>`<button class="opt" id="o${i}" onclick="ans(${i})">${o}</button>`).join(""):`<input class="inp" id="v" inputmode="decimal" placeholder="الجواب"><button class="btn" style="text-align:center" onclick="ans(document.getElementById('v').value)">تأكيد</button>`}</div>
<div id="hs"></div><button class="lnk" id="hb" onclick="hint()">🪜 تلميح (−XP)</button><div id="fb"></div><div class="src">المصدر: <bdi>${it.source.file} · ${it.source.loc}</bdi></div></div><button class="lnk" onclick="home()">↩ رجوع (التقدّم محفوظ)</button>`)}
function hint(){const it=MIX[D.i];if(done||h>=it.hints.length)return;document.getElementById("hs").innerHTML+=`<div class="hint">تلميح ${h+1}: <span dir="auto" style="unicode-bidi:plaintext">${it.hints[h]}</span></div>`;h++}
function ans(v){if(done)return;const it=MIX[D.i];if(it.kind!="mc"&&String(v).trim()==="")return;const ok=it.kind=="mc"?v===it.a:nrm(v)===nrm(it.a);done=true;
 if(it.kind=="mc")document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(j===it.a)b.classList.add("ok");else if(j===v)b.classList.add("no")});
 const xp=ok?Math.max(4,10-3*h):0;D.xp+=xp;ENG.record(M,it,ok&&h<2,D.date);
 D.r.push({id:it.id,subject:it.subject,topic:it.topic,why:it.why,ok,hints:h,sec:Math.round((Date.now()-window.t0)/1000)});D.i++;save();document.getElementById("xp").textContent=D.xp;
 document.getElementById("hb").remove();document.getElementById("fb").innerHTML=`<div class="fb"><b style="color:${ok?"var(--lime)":"var(--red)"}">${ok?"MISSION PASSED! +"+xp+" XP":"WASTED"}</b><br>${ok?"":"الجواب: <bdi>"+(it.kind=="mc"?it.o[it.a]:it.a)+"</bdi><br>"}<span dir="auto" style="unicode-bidi:plaintext;display:block">${it.ex||""}</span></div><button class="btn" style="text-align:center" onclick="show()">التالي ←</button>`}
function send(){if(!CFG.u||!CFG.k||D.sent||!D.r.length)return;fetch(CFG.u,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({k:CFG.k,code:CODE,session:'daily-mix '+D.date,rows:D.r})}).then(()=>{D.sent=1;save()}).catch(()=>{})}
function end(){clearInterval(tick);send();const c=D.r.filter(x=>x.ok).length;if(!D.r.length)return home();
 $(`<div class="card"><div class="logo" style="font-size:20px">DAILY MIX · RESULT</div><div class="big">${Math.round(100*c/D.r.length)}%</div><div class="sub">${c} من ${D.r.length} صح · ${D.xp} XP · ${fmt(D.used)} دقيقة</div><button class="btn" style="text-align:center" onclick="map()">🗺️ شوف خريطة الإتقان</button><div class="sub">خلطة جديدة بكرا 👊</div></div><button class="lnk" onclick="home()">↩ رجوع</button>`)}
function map(){clearInterval(tick);const keys=[...new Set(BANK.map(ENG.key))];
 const rows=["ar","en","ma"].map(s=>`<tr><td colspan="2" style="color:var(--gold);font-weight:700">${SUB[s]}</td></tr>`+keys.filter(k=>k.startsWith(s+"|")).map(k=>{const m=ENG.mastery(M,k),p=m==null?null:Math.round(100*m),col=p==null?"#4b3570":p>=90?"var(--lime)":p>=70?"var(--gold)":"var(--red)";
  return `<tr><td>${k.split("|")[1]}<div class="bar" style="margin:4px 0;position:relative"><i style="width:${p||0}%;background:${col}"></i><span style="position:absolute;top:0;bottom:0;left:10%;width:2px;background:#fff8"></span></div></td><td class="n">${p==null?"—":p+"%"}</td></tr>`}).join("")).join("");
 $(`<div class="logo" style="font-size:20px">MASTERY MAP</div><div class="sub">الخط الأبيض = 90 · 🟢 ≥90 · 🟡 70–89 · 🔴 أقل · — لسّا ما انفحص</div><div class="card"><table>${rows}</table></div><button class="lnk" onclick="home()">↩ رجوع</button>`)}
</script></body></html>
