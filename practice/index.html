<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>البطل · خلطة اليوم</title><style>
:root{--bg:#0b0614;--card:#160d24;--pink:#ff2bd6;--cyan:#21f3ff;--lime:#a6ff3b;--gold:#ffc83d;--red:#ff4060;--tx:#f2eaff;--mut:#a99bc4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#3a0f55,transparent 50%),radial-gradient(circle at 0% 110%,#06364a,transparent 50%),var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
.wrap{max-width:480px;margin:auto;padding:16px}
.logo{font-weight:900;font-size:26px;letter-spacing:1px;text-align:center;margin:8px 0 2px;color:var(--gold);text-shadow:0 0 12px #ff8a00,3px 3px 0 #000;font-style:italic}
.sub{text-align:center;color:var(--mut);font-size:13px;margin-bottom:14px}
.city{height:60px;margin:6px 0 14px;background:linear-gradient(transparent 60%,#ff2bd633),repeating-linear-gradient(90deg,#1e1233 0 18px,#24163d 18px 30px,#170c28 30px 44px);clip-path:polygon(0 60%,6% 60%,6% 20%,12% 20%,12% 45%,20% 45%,20% 5%,27% 5%,27% 50%,35% 50%,35% 30%,44% 30%,44% 0,50% 0,50% 40%,60% 40%,60% 15%,68% 15%,68% 55%,76% 55%,76% 25%,85% 25%,85% 45%,93% 45%,93% 10%,100% 10%,100% 100%,0 100%);border-bottom:2px solid var(--pink)}
.btn{display:block;width:100%;padding:14px;margin:10px 0;border-radius:14px;border:2px solid var(--cyan);background:#0e1b2b;color:var(--tx);font-size:17px;font-weight:700;text-align:right;cursor:pointer;box-shadow:0 0 10px #21f3ff44}
.btn small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.btn.done{border-color:var(--lime);box-shadow:0 0 10px #a6ff3b55}
.card{background:var(--card);border:1px solid #3b2560;border-radius:18px;padding:16px;box-shadow:0 0 22px #ff2bd622}
.hud{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;font-size:13px;color:var(--mut)}
.bar{height:8px;background:#2a1a40;border-radius:8px;margin:8px 0 12px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--cyan))}
.tag{display:inline-block;font-size:12px;color:var(--cyan);border:1px solid var(--cyan);border-radius:20px;padding:2px 10px}
.ctx{background:#0f0819;border-right:3px solid var(--gold);padding:10px;margin:10px 0;font-size:14px;color:#e0d4f5;line-height:1.7}
.q{font-size:18px;line-height:1.7;margin:12px 0}
.opt{display:block;width:100%;text-align:inherit;margin:8px 0;padding:12px;border-radius:12px;border:1px solid #4b3570;background:#1d1230;color:var(--tx);font-size:16px;cursor:pointer}
.opt.ok{border-color:var(--lime);background:#183a10}.opt.no{border-color:var(--red);background:#3a0f1a}
.fb{margin-top:10px;font-size:15px;line-height:1.6}.fb b{font-size:20px;font-style:italic}
.src{font-size:11px;color:var(--mut);margin-top:10px}
.ltr{direction:ltr;text-align:left}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:7px 4px;border-bottom:1px solid #2e1e47}td.n{text-align:left;font-weight:700}
.big{font-size:44px;font-weight:900;text-align:center;color:var(--lime);text-shadow:0 0 14px #a6ff3b88}
.lnk{color:var(--mut);background:none;border:0;font-size:13px;text-decoration:underline;cursor:pointer;margin-top:8px}

.inp{width:100%;padding:12px;font-size:18px;border-radius:12px;border:1px solid #4b3570;background:#1d1230;color:var(--tx);direction:ltr;text-align:center}
.hint{font-size:14px;color:var(--gold);margin-top:6px}</style></head><body><div class="wrap" id="app"></div><script>
const MIX=[{"id": "en-read-25-24-11", "subject": "en", "topic": "فهم مقروء", "q": "At first, many artists wondered whether their skills would still be relevant if companies _____ just use computers to create original artwork.", "a": 0, "o": ["could", "reply", "concern", "participate"], "ex": "The text says: \"At first, many artists wondered whether their skills would still be relevant if companies could just use computers to create original artwork.\"", "ctx": "Article: AI AND OUR FUTURE", "source": {"file": "english/لغة إنجليزية 25-24.pdf", "loc": "Part I article", "quote": "At first, many artists wondered whether their skills would still be relevant if companies could just use computers to create original artwork."}, "ltr": true, "kind": "mc", "hints": ["Read the whole sentence", "Which part of speech fits the gap?", "Recall the article's idea"]}, {"id": "ar-cur-08", "subject": "ar", "topic": "إكمال جمل", "q": "«الناس ليسوا على ___ واحد ولا على عقيدة واحدة… لكلٍّ طريقته في النظر إلى الأمور و___ الأشياء، بل إنّ ما ___ الواحد قد يسوء الآخر، وما يُستقبح اليوم قد ___ غدًا»", "a": 1, "o": ["قول / معرفة / يُغضب / يُحبّ", "رأي / تصوّر / يُرضي / يُستملح", "أمر / تفحّص / يستملحه / نرضاه", "مبدإ / اعتقاد / يُرضي / نعتنقه"], "ex": "يُرضي ضد يسوء، ويُستملح ضد يُستقبح.", "ctx": null, "source": {"file": "arabic/لغة عربية 25-26.pdf", "loc": "سؤال 21"}, "ltr": null, "kind": "mc", "hints": ["ارجع للقاعدة", "استبعد الخيارات الأبعد", "فكّر بالسياق"]}, {"id": "en-def-star", "subject": "en", "topic": "مفردات", "q": "Choose the best definition: star", "a": 0, "o": ["Performer", "the number of people living in a particular area.", "picture, especially on film or television.", "what you can see from a particular place."], "ex": "star = Performer", "ctx": null, "source": {"file": "english/كلمات LEXICAL BAND II-2.pdf", "loc": "line 1966 (txt)", "quote": "Performer"}, "ltr": true, "kind": "mc", "hints": ["Think of the word family", "Which option could replace the word in a sentence?", "Eliminate the other parts of speech"]}, {"id": "en-read-19-18-01", "subject": "en", "topic": "فهم مقروء", "q": "One technological cause of laziness is, surprisingly, the modern alarm clock, which has a _____ called a \"snooze\" button.", "a": 0, "o": ["feature", "finding/findings", "event", "liter"], "ex": "The text says: \"One technological cause of laziness is, surprisingly, the modern alarm clock, which has a feature called a \"snooze\" button.\"", "ctx": "Article: Technology for the Lazy", "source": {"file": "english/لغة إنجليزية 19-18.pdf", "loc": "Part I article", "quote": "One technological cause of laziness is, surprisingly, the modern alarm clock, which has a feature called a \"snooze\" button."}, "ltr": true, "kind": "mc", "hints": ["Read the whole sentence", "Which part of speech fits the gap?", "Recall the article's idea"]}, {"id": "ma-mean_reverse-19", "subject": "ma", "topic": "إحصاء: معدّل عكسي", "q": "معدّل علامات طالب في 7 امتحانات هو 68. شو لازم تكون علامته بالامتحان رقم 8 حتى يصير المعدّل 71؟", "a": 92, "o": null, "ex": "8×71 − 7×68 = 568 − 476 = 92", "ctx": null, "source": {"file": "math/رياضيات 25-26.pdf", "loc": "السؤال 3"}, "ltr": null, "kind": "num", "hints": ["مجموع الـ7 = 7×68", "المجموع المطلوب = 8×71", "اطرح"]}, {"id": "ma-parabola_vertex-17", "subject": "ma", "topic": "قطع مكافئ: الرأس", "q": "جد إحداثيّ y لرأس القطع المكافئ y = −x² − 2x + 3.", "a": 4, "o": null, "ex": "x = -1 ← y = 4", "ctx": null, "source": {"file": "math/رياضيات 25-26.pdf", "loc": "السؤال 9ب"}, "ltr": null, "kind": "num", "hints": ["x الرأس = −b/2a", "a = −1", "عوّض x بالدالة"]}, {"id": "en-def-fresh", "subject": "en", "topic": "مفردات", "q": "Choose the best definition: fresh", "a": 0, "o": ["new, food, drink", "useful", "able to be seen.", "modern, high level."], "ex": "fresh = new, food, drink", "ctx": null, "source": {"file": "english/كلمات LEXICAL BAND II-2.pdf", "loc": "line 794 (txt)", "quote": "new, food, drink"}, "ltr": true, "kind": "mc", "hints": ["Think of the word family", "Which option could replace the word in a sentence?", "Eliminate the other parts of speech"]}, {"id": "ar-cur-05", "subject": "ar", "topic": "قواعد: أقسام الكلام", "q": "نوع الكلمات (مَن، بعض، باتَ، كي، إيّاكَ) على التوالي:", "a": 3, "o": ["اسم، اسم، حرف، حرف، اسم", "حرف، اسم، حرف، اسم، اسم", "حرف، حرف، فعل، حرف، حرف", "اسم، اسم، فعل، حرف، اسم"], "ex": "مَن اسم موصول/استفهام، بعض اسم، بات فعل ناقص، كي حرف، إيّاك ضمير (اسم).", "ctx": null, "source": {"file": "arabic/لغة عربية 25-26.pdf", "loc": "سؤال 20"}, "ltr": null, "kind": "mc", "hints": ["ارجع للقاعدة", "استبعد الخيارات الأبعد", "فكّر بالسياق"]}, {"id": "ma-parabola_vertex-21", "subject": "ma", "topic": "قطع مكافئ: الرأس", "q": "جد إحداثيّ y لرأس القطع المكافئ y = −x² + 6x + 1.", "a": 10, "o": null, "ex": "x = 3 ← y = 10", "ctx": null, "source": {"file": "math/رياضيات 25-26.pdf", "loc": "السؤال 9ب"}, "ltr": null, "kind": "num", "hints": ["x الرأس = −b/2a", "a = −1", "عوّض x بالدالة"]}];const KEY="hero_mix_demo";let S=JSON.parse(localStorage.getItem(KEY)||'{"i":0,"r":[],"xp":0}'),h=0,done=false;
const save=()=>localStorage.setItem(KEY,JSON.stringify(S)),$=x=>document.getElementById("app").innerHTML=x;
const nrm=s=>String(s).replace(/\s/g,"").replace(/،/g,",");
function show(){const it=MIX[S.i];if(!it)return end();h=0;done=false;window.t0=Date.now();const d=it.ltr?"ltr":"";
$(`<div class="logo" style="font-size:20px">DAILY MIX · 15 MIN</div><div class="card"><div class="hud"><span>مهمّة ${S.i+1}/${MIX.length}</span><span>XP <b id="xp">${S.xp}</b></span></div><div class="bar"><i style="width:${100*S.i/MIX.length}%"></i></div>
<span class="tag">${it.topic}</span>${it.ctx?`<div class="ctx ${d}">${it.ctx}</div>`:""}<div class="q ${d}">${it.q}</div><div class="${d}">${it.kind=="mc"?it.o.map((o,i)=>`<button class="opt" id="o${i}" onclick="ans(${i})">${o}</button>`).join(""):`<input class="inp" id="v" inputmode="decimal" placeholder="الجواب"><button class="btn" style="text-align:center" onclick="ans(document.getElementById('v').value)">افحص</button>`}</div>
<div id="hs"></div><button class="lnk" id="hb" onclick="hint()">🪜 تلميح (−XP)</button><div id="fb"></div><div class="src">المصدر: <bdi>${it.source.file} · ${it.source.loc}</bdi></div></div>`)}
function hint(){const it=MIX[S.i];if(done||h>=it.hints.length)return;document.getElementById("hs").innerHTML+=`<div class="hint">تلميح ${h+1}: <span dir="auto" style="unicode-bidi:plaintext">${it.hints[h]}</span></div>`;h++}
function ans(v){if(done)return;const it=MIX[S.i];const ok=it.kind=="mc"?v===it.a:nrm(v)===nrm(it.a);if(it.kind!="mc"&&String(v).trim()==="")return;done=true;
if(it.kind=="mc")document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(j===it.a)b.classList.add("ok");else if(j===v)b.classList.add("no")});
const xp=ok?Math.max(4,10-3*h):0;S.xp+=xp;S.r.push({id:it.id,topic:it.topic,ok,hints:h,sec:Math.round((Date.now()-window.t0)/1000)});S.i++;save();document.getElementById("xp").textContent=S.xp;
document.getElementById("hb").remove();document.getElementById("fb").innerHTML=`<div class="fb"><b style="color:${ok?"var(--lime)":"var(--red)"}">${ok?"MISSION PASSED! +"+xp+" XP":"WASTED"}</b><br>${ok?"":"الجواب: <bdi>"+it.a+"</bdi><br>"}<span dir="auto" style="unicode-bidi:plaintext;display:block">${it.ex}</span></div><button class="btn" style="text-align:center" onclick="show()">التالي ←</button>`}
const CFG=Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
function send(){if(!CFG.u||!CFG.k||S.sent)return;fetch(CFG.u,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({k:CFG.k,code:CFG.c||'anon',session:'daily-mix',rows:S.r})}).then(()=>{S.sent=1;save()}).catch(()=>{})}
function end(){send();const c=S.r.filter(x=>x.ok).length;$(`<div class="card"><div class="logo" style="font-size:20px">DAILY MIX · RESULT</div><div class="big">${Math.round(100*c/S.r.length)}%</div><div class="sub">${c}/${S.r.length} · XP ${S.xp}</div><table>${S.r.map(x=>`<tr><td>${x.topic}</td><td class="n" style="color:${x.ok?"var(--lime)":"var(--red)"}">${x.ok?"✓":"✗"}${x.hints?" · 🪜"+x.hints:""}</td></tr>`).join("")}</table></div><button class="btn" style="text-align:center" onclick="localStorage.removeItem(KEY);S={i:0,r:[],xp:0};show()">جولة من جديد</button>`)}
show();</script></body></html>
